<!DOCTYPE html>

<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 30%, #0d0d3d 60%, #050520 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: system-ui, -apple-system, sans-serif;
  color: white;
  overflow: hidden;
  position: relative;
}
/* Animated stars */
.stars {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.8), transparent),
    radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 200px 60px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 250px 20px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 300px 90px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 350px 40px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 400px 70px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 450px 30px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 500px 50px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 550px 80px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 600px 20px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 650px 60px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 700px 40px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 750px 90px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 800px 30px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 850px 70px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 900px 50px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 950px 20px, rgba(255,255,255,0.8), transparent),
    radial-gradient(1px 1px at 1000px 80px, rgba(255,255,255,0.6), transparent),
    radial-gradient(2px 2px at 1050px 40px, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 1100px 60px, rgba(255,255,255,0.5), transparent),
    radial-gradient(2px 2px at 1150px 30px, rgba(255,255,255,0.8), transparent);
}
/* Glow effect */
.glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(96,165,250,0.15) 0%, transparent 70%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
/* Earth globe representation */
.globe {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 30%, #1a4a6e 50%, #0d3a5c 70%, #1e3a5f 100%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 80px rgba(96,165,250,0.3), inset -20px -20px 40px rgba(0,0,0,0.3);
  border: 2px solid rgba(96,165,250,0.3);
}
.globe::before {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: 
    linear-gradient(90deg, transparent 40%, rgba(96,165,250,0.1) 50%, transparent 60%),
    linear-gradient(0deg, transparent 30%, rgba(96,165,250,0.08) 50%, transparent 70%);
}
/* City dots on globe */
.city-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #60a5fa;
  box-shadow: 0 0 10px rgba(96,165,250,0.8);
}
.city-dot.ny { top: 35%; left: 28%; }
.city-dot.london { top: 28%; left: 48%; }
.city-dot.tokyo { top: 38%; left: 82%; }
.city-dot.sydney { top: 72%; left: 85%; }
.city-dot.dubai { top: 42%; left: 62%; }
.city-dot.paris { top: 30%; left: 50%; }
.city-dot.la { top: 38%; left: 15%; }
.city-dot.singapore { top: 52%; left: 75%; }
/* Text content */
.content {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 40px;
}
.logo {
  font-size: 1.2rem;
  color: #60a5fa;
  margin-bottom: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 600;
}
h1 {
  font-size: 3.2rem;
  font-weight: 800;
  margin-bottom: 16px;
  background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 50%, #93c5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}
.subtitle {
  font-size: 1.3rem;
  color: rgba(255,255,255,0.7);
  margin-bottom: 30px;
  font-weight: 300;
}
.features {
  display: flex;
  gap: 24px;
  justify-content: center;
  flex-wrap: wrap;
}
.feature {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 0.9rem;
  color: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
}
.feature strong {
  color: #60a5fa;
}
.url {
  position: absolute;
  bottom: 30px;
  font-size: 1rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
}
</style>
