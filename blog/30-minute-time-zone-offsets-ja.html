            <h1>なぜ一部の国が30分のタイムゾーンオフセットを使うのか</h1>
            <div class="blog-meta">📅 2026年6月24日 &nbsp;·&nbsp; ⏱ 7分で読めます &nbsp;·&nbsp; 🏷 インド, イラン, ネパール, オフセット</div>
            <p>ほとんどのタイムゾーンはUTCからちょうど1時間刻みです。UTC+1、UTC+5、UTC−8。きれい。シンプル。でも、いくつかの国はこのシステムを見て「いや、うちは30分刻みで」と言いました。</p>
            <p>なぜ？ 答えはだいたい地理と政治です。</p>
            <h2>インド：UTC+5:30</h2>
            <p>インドは東西にほぼ30度の経度にまたがります — これでタイムゾーン2つ分です。でもインドは1つを選びました：UTC+5:30、東部と西部の妥協点です。コルカタ（東部）では夏の日の出が午前4時半ごろ、グジャラート（西部）では午前6時半ごろ。どちらも同じ時計を使っています。</p>
            <p>この30分のオフセットは、インドをパキスタン（UTC+5）とバングラデシュ（UTC+6）のちょうど真ん中に置きます。地理的な妥協であると同時に、政治的な妥協でもあります。</p>
            <h2>イラン：UTC+3:30</h2>
            <p>イランのオフセットは、西の隣国（イラク、サウジアラビアのUTC+3）より30分進み、東のアフガニスタン（UTC+4:30）より30分遅れています。イランにはサマータイムもあり（UTC+4:30）、夏にはアフガニスタンと同じオフセットになります。冬はユニークです。</p>
            <h2>ネパール：UTC+5:45</h2>
            <p>世界で一番変わったオフセット。ネパールは巨大な隣国インドより45分進んでいます。理由：ネパールはインドのタイムゾーンからの独立を示したかったのです。45分のオフセットは、ネパールの地理的位置（東経86度付近、UTCから5時間44分）とほぼ一致します。世界で45分のオフセットを持つのはここを含めて2つだけです。</p>
            <h2>もう一つの45分：チャタム諸島（UTC+12:45）</h2>
            <p>ニュージーランドのチャタム諸島は冬にUTC+12:45、夏にUTC+13:45を使います。ニュージーランド本土より45分進んでいます。理由は地理的：チャタム諸島は本土のかなり東にあり、UTC+13だと現地の太陽時から離れすぎてしまうからです。</p>
            <h2>オーストラリアのパッチワーク</h2>
            <p>オーストラリア本土には3つの標準オフセットがあります：UTC+8（西部）、UTC+9:30（中部）、UTC+10（東部）。中央の30分オフセットのせいで、パースからシドニーまで運転すると時計を2回合わせ直すことになります — 1回じゃありません。そしてロード・ハウ島は冬にUTC+10:30、夏にUTC+11を使います（30分のサマータイム、世界でここだけ）。</p>
            <h2>なぜ丸めないのか？</h2>
            <p>インドは単にUTC+6（バングラデシュと同じ）にすべきだ、という意見もあります。でもそうすると、ムンバイの冬の日の出が午前7時半になります — インドの感覚では遅すぎます。30分のオフセットは、全国どこでも日の出と夕食を「妥当な」時刻に保つための妥協なのです。</p>
            <p>30分オフセットはソフトウェア開発者にとっては頭痛の種。でもそこで暮らす人たちにとっては、ちょうどいい。</p>
