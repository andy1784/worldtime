            <h1>为什么有些国家使用30分钟时区偏移</h1>
            <div class="blog-meta">📅 2026年6月24日 &nbsp;·&nbsp; ⏱ 7分钟阅读 &nbsp;·&nbsp; 🏷 印度, 伊朗, 尼泊尔, 偏移</div>
            <p>大多数时区都是从UTC开始的整小时偏移。UTC+1、UTC+5、UTC−8。整齐。简单。但有些国家看了这套系统，说：「不，我们要用半小时。」</p>
            <p>为什么？答案通常藏在地理和政治里。</p>
            <h2>印度：UTC+5:30</h2>
            <p>印度东西横跨近30度经度 — 本来够分两个时区。但印度只选了一个：UTC+5:30，是东部和西部的折中。加尔各答（东部）夏天日出约在凌晨4:30，古吉拉特（西部）约在6:30。两地挂同一块钟。</p>
            <p>半小时偏移把印度放在巴基斯坦（UTC+5）和孟加拉国（UTC+6）正中间。这既是地理妥协，也是政治妥协。</p>
            <h2>伊朗：UTC+3:30</h2>
            <p>伊朗的偏移比西边邻国（伊拉克、沙特阿拉伯 UTC+3）早30分钟，比东边阿富汗（UTC+4:30）晚30分钟。伊朗也实行夏令时（UTC+4:30），所以夏天和阿富汗同步，冬天则独一无二。</p>
            <h2>尼泊尔：UTC+5:45</h2>
            <p>世界上最古怪的偏移。尼泊尔比巨大邻国印度早45分钟。原因：尼泊尔想在时区上宣示独立于印度。45分钟偏移大致对应尼泊尔地理位置（东经86°，UTC+5:44）。世界上只有两个45分钟偏移，这是其中之一。</p>
            <h2>另一个45分钟：查塔姆群岛（UTC+12:45）</h2>
            <p>新西兰查塔姆群岛冬用UTC+12:45、夏用UTC+13:45。比新西兰本土早45分钟。原因是地理：群岛在本土显著东侧，若用UTC+13会让当地钟时偏离太阳时太远。</p>
            <h2>澳大利亚的拼图</h2>
            <p>澳大利亚大陆有三个标准偏移：UTC+8（西部）、UTC+9:30（中部）、UTC+10（东部）。中部的半小时偏移意味着从珀斯开到悉尼，得拨两次表 — 不是一次。豪勋爵岛冬用UTC+10:30、夏用UTC+11（30分钟夏令时调整，全球独有）。</p>
            <h2>为什么不直接取整？</h2>
            <p>有人会说印度直接用UTC+6（像孟加拉国）不就行了。但那样孟买冬天日出会是早上7:30 — 按印度标准太晚了。半小时偏移是个妥协，让全国日出和晚餐都落在「合理」钟点上。</p>
            <p>半小时偏移让软件工程师头大。但对住在那里的人来说，刚刚好。</p>
