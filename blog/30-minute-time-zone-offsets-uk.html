            <h1>Чому деякі країни використовують 30-хвилинні часові зони</h1>
            <div class="blog-meta">📅 24 червня 2026 &nbsp;·&nbsp; ⏱ 7 хв читання &nbsp;·&nbsp; 🏷 Індія, Іран, Непал, Зсуви</div>
            <p>Більшість часових зон — це рівні годинні зсуви від UTC. UTC+1, UTC+5, UTC−8. Чисто. Просто. Але деякі країни поглянули на цю систему і сказали: «Ні, ми будемо використовувати півгодини».</p>
            <p>Чому? Відповідь зазвичай ховається в географії та політиці.</p>
            <h2>Індія: UTC+5:30</h2>
            <p>Індія простягається майже на 30 градусів довготи — достатньо для двохчасових поясів. Але Індія обрала один: UTC+5:30, компроміс між східною і західною частинами країни. У Калькутті (на сході) сонце сходить летом близько 4:30 ранку, а в Гуджараті (на заході) — близько 6:30. У обох однаковий час на годиннику.</p>
            <p>Півгодинний зсув ставить Індію приблизно посередині між Пакистаном (UTC+5) та Бангладешем (UTC+6). Це політичний компроміс не менш, ніж географічний.</p>
            <h2>Іран: UTC+3:30</h2>
            <p>Іранський зсув ставить його на 30 хвилин уперед від західних сусідів (Ірак, Саудівська Аравія на UTC+3) і на 30 хвилин позаду Афганістану (UTC+4:30) наschodі. В Ірані також є літній час (UTC+4:30), тому літом він співпадає з Афганістаном, азимою — унікальний.</p>
            <h2>Непал: UTC+5:45</h2>
            <p>Найдивніший зсув у світі. Непал перепереджає свого гігантського сусіда Індію на 45 хвилин. Причина: Непал хотів підкреслити незалежність від індійського часового поясу. 45-хвилинний зсув приблизно відповідає географічному положенню Непалу (близько 86° сх.д., що дає 5г44хв від UTC). Це один з лише двох 45-хвилинних зсувів у світі.</p>
            <h2>Ще один 45-хвилинний: острови Чатем (UTC+12:45)</h2>
            <p>Острови Чатем Нової Зеландії використовують UTC+12:45зимою, UTC+13:45літом. Вони перепереджають континентальну Нову Зеландію на 45 хвилин. Причина географічна: Чатеми лежать значно східніше материка, і повний +13 поставив би їх занадто далеко від їх сонячного часу.</p>
            <h2>Мозаїка Австралії</h2>
            <p>Австралія має на континенті три стандартні зсуви: UTC+8 (Захід), UTC+9:30 (Центр), UTC+10 (Схід). Півгодинний пояс у центрі означає: їхавши з Перта в Сідней, ви перекладаєте годинник двічі — не один раз. А острів Лорд-Гау використовуєзимою UTC+10:30, літом UTC+11 (30-хвилинний перехід на літній час, унікальний у світі).</p>
            <h2>Чому не просто округлити?</h2>
            <p>Можна сказати, що Індії слід просто бути UTC+6 (як Бангладеш). Але тоді в Мумбаїзимою схід сонця був би о 7:30 — пізно за індійськими стандартами. Півгодинний компроміс тримає схід сонця і вечерю в «розумних» годинах по всій країні.</p>
            <p>Півгодинні зсуви — головний біль для програмістів. Для людей, що там живуть — ідеально.</p>
