            <h1>Perché alcuni paesi usano fusi orari con offset di 30 minuti</h1>
            <div class="blog-meta">📅 24 giugno 2026 &nbsp;·&nbsp; ⏱ 7 min di lettura &nbsp;·&nbsp; 🏷 India, Iran, Nepal, Offset</div>
            <p>La maggior parte dei fusi orari sono salti di un'ora esatti da UTC. UTC+1, UTC+5, UTC−8. Pulito. Semplice. Ma alcuni paesi hanno guardato questo sistema e hanno detto: «No, noi usiamo le mezz'ore».</p>
            <p>Perché? La risposta sta di solito nella geografia e nella politica.</p>
            <h2>India: UTC+5:30</h2>
            <p>L'India si estende per quasi 30 gradi di longitudine — abbastanza per due fusi orari. Ma l'India ne ha scelto uno solo: UTC+5:30, un compromesso tra la parte orientale e occidentale del paese. A Calcutta (est) il sole sorge d'estate verso le 4:30 del mattino, mentre nel Gujarat (ovest) verso le 6:30. Entrambi segnano la stessa ora sull'orologio.</p>
            <p>L'offset di mezz'ora mette l'India circa a metà strada tra il Pakistan (UTC+5) e il Bangladesh (UTC+6). È un compromesso politico tanto quanto geografico.</p>
            <h2>Iran: UTC+3:30</h2>
            <p>L'offset iraniano lo mette 30 minuti avanti ai vicini occidentali (Iraq, Arabia Saudita in UTC+3) e 30 minuti dietro l'Afghanistan (UTC+4:30) a est. L'Iran ha anche l'ora legale (UTC+4:30), il che significa che d'estate condivide l'offset dell'Afghanistan. D'inverno, è unico.</p>
            <h2>Nepal: UTC+5:45</h2>
            <p>L'offset più strano del mondo. Il Nepal è 45 minuti avanti al suo enorme vicino India. La ragione: il Nepal voleva affermare l'indipendenza dal fuso orario indiano. L'offset di 45 minuti pone il Nepal grossomodo allineato con la sua posizione geografica (circa 86° E, che sono 5h44m da UTC). È uno dei soli due offset di 45 minuti al mondo.</p>
            <h2>L'altro 45: isole Chatham (UTC+12:45)</h2>
            <p>Le isole Chatham della Nuova Zelanda usano UTC+12:45 in inverno, UTC+13:45 in estate. Sono 45 minuti avanti alla Nuova Zelanda continentale. La ragione è geografica: le Chatham sono significativamente a est dell'isola principale, e un UTC+13 completo le metterebbe troppo avanti rispetto al loro tempo solare.</p>
            <h2>Il patchwork dell'Australia</h2>
            <p>L'Australia ha tre offset standard nel suo continente: UTC+8 (Ovest), UTC+9:30 (Centro), UTC+10 (Est). L'offset di mezz'ora al centro significa che guidando da Perth a Sydney cambi l'orologio due volte — non una. E l'isola Lord Howe usa UTC+10:30 in inverno, UTC+11 in estate (un cambio d'ora legale di 30 minuti, unico al mondo).</p>
            <h2>Perché non arrotondare semplicemente?</h2>
            <p>Si potrebbe obiettare che l'India dovrebbe essere semplicemente UTC+6 (come il Bangladesh). Ma allora il sole a Mumbai sorgerebbe alle 7:30 d'inverno — tardi per gli standard indiani. L'offset di mezz'ora è un compromesso che mantiene l'alba e la cena a orari 'ragionevoli' in tutto il paese.</p>
            <p>Gli offset di mezz'ora sono un incubo per gli sviluppatori software. Per le persone che ci vivono, sono perfetti.</p>
