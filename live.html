<body>
    <div class="container">

    <script>
    // Featured cities with their timezones
    const featuredCities = [
        { name: 'New York', tz: 'America/New_York', flag: '🇺🇸' },
        { name: 'London', tz: 'Europe/London', flag: '🇬🇧' },
        { name: 'Tokyo', tz: 'Asia/Tokyo', flag: '🇯🇵' },
        { name: 'Dubai', tz: 'Asia/Dubai', flag: '🇦🇪' },
        { name: 'Sydney', tz: 'Australia/Sydney', flag: '🇦🇺' },
        { name: 'Paris', tz: 'Europe/Paris', flag: '🇫🇷' },
    ];
    
    // Quick access cities
    const quickCities = [
        { name: 'New York', tz: 'America/New_York', path: '/time/new-york.html' },
        { name: 'London', tz: 'Europe/London', path: '/time/london.html' },
        { name: 'Tokyo', tz: 'Asia/Tokyo', path: '/time/tokyo.html' },
        { name: 'Dubai', tz: 'Asia/Dubai', path: '/time/dubai.html' },
        { name: 'Sydney', tz: 'Australia/Sydney', path: '/time/sydney.html' },
        { name: 'Paris', tz: 'Europe/Paris', path: '/time/paris.html' },
        { name: 'Berlin', tz: 'Europe/Berlin', path: '/time/berlin.html' },
        { name: 'Mumbai', tz: 'Asia/Kolkata', path: '/time/mumbai.html' },
        { name: 'Beijing', tz: 'Asia/Shanghai', path: '/time/beijing.html' },
        { name: 'São Paulo', tz: 'America/Sao_Paulo', path: '/time/sao-paulo.html' },
        { name: 'Los Angeles', tz: 'America/Los_Angeles', path: '/time/los-angeles.html' },
        { name: 'Singapore', tz: 'Asia/Singapore', path: '/time/singapore.html' },
        { name: 'Hong Kong', tz: 'Asia/Hong_Kong', path: '/time/hong-kong.html' },
        { name: 'Moscow', tz: 'Europe/Moscow', path: '/time/moscow.html' },
        { name: 'Seoul', tz: 'Asia/Seoul', path: '/time/seoul.html' },
        { name: 'Toronto', tz: 'America/Toronto', path: '/time/toronto.html' },
        { name: 'Mexico City', tz: 'America/Mexico_City', path: '/time/mexico-city.html' },
        { name: 'Cairo', tz: 'Africa/Cairo', path: '/time/cairo.html' },
        { name: 'Bangkok', tz: 'Asia/Bangkok', path: '/time/bangkok.html' },
        { name: 'Istanbul', tz: 'Europe/Istanbul', path: '/time/istanbul.html' },
        { name: 'Lagos', tz: 'Africa/Lagos', path: '/time/lagos.html' },
        { name: 'Buenos Aires', tz: 'America/Argentina/Buenos_Aires', path: '/time/buenos-aires.html' },
        { name: 'Jakarta', tz: 'Asia/Jakarta', path: '/time/jakarta.html' },
        { name: 'Shanghai', tz: 'Asia/Shanghai', path: '/time/shanghai.html' },
    ];
    
    function getTimeData(tz) {
        const now = new Date();
        const timeStr = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        }).format(now);
        
        const dateStr = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            weekday: 'short',
            month: 'short',
            day: 'numeric'
        }).format(now);
        
        const hour = parseInt(new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            hour: 'numeric',
            hour12: false
        }).format(now));
        
        const offset = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            timeZoneName: 'shortOffset'
        }).formatToParts(now).find(p => p.type === 'timeZoneName').value;
        
        const abbr = new Intl.DateTimeFormat('en-US', {
            timeZone: tz,
            timeZoneName: 'short'
        }).formatToParts(now).find(p => p.type === 'timeZoneName').value;
        
        let period = 'day';
        let icon = '☀️';
        if (hour >= 6 && hour < 8) { period = 'dawn'; icon = '🌅'; }
        else if (hour >= 8 && hour < 18) { period = 'day'; icon = '☀️'; }
        else if (hour >= 18 && hour < 20) { period = 'dawn'; icon = '🌇'; }
        else { period = 'night'; icon = '🌙'; }
        
        return { timeStr, dateStr, offset, abbr, period, icon, hour };
    }
    
    function updateClocks() {
        const featured = document.getElementById('featured');
        featured.innerHTML = featuredCities.map(city => {
            const data = getTimeData(city.tz);
            const [h, m, s] = data.timeStr.split(':');
            return `
                <div class="clock-card ${data.period}">
                    <div class="clock-header">
                        <span class="city-name">${city.flag} ${city.name}</span>
                        <span class="day-night-icon">${data.icon}</span>
                    </div>
                    <div class="time-display">
                        ${h}:${m}<span class="seconds">:${s}</span>
                    </div>
                    <div class="date-display">${data.dateStr}</div>
                    <div class="tz-info">
                        <span>${data.abbr}</span>
                        <span>${data.offset}</span>
                    </div>
                </div>
            `;
        }).join('');
        
        // Update quick city times
        document.querySelectorAll('.city-link').forEach(link => {
            const tz = link.dataset.tz;
            if (tz) {
                const data = getTimeData(tz);
                const timeEl = link.querySelector('.time');
                if (timeEl) timeEl.textContent = data.timeStr;
            }
        });
    }
    
    function initCityGrid() {
        const grid = document.getElementById('cityGrid');
        grid.innerHTML = quickCities.map(city => {
            const data = getTimeData(city.tz);
            return `
                <a href="${city.path}" class="city-link" data-tz="${city.tz}">
                    <span class="name">${city.name}</span>
                    <span class="time">${data.timeStr}</span>
                </a>
            `;
        }).join('');
    }
    
    function copyLink() {
        navigator.clipboard.writeText('https://worldtimessync.com/live.html').then(() => {
            const btn = document.querySelector('.share-btn.copy');
            btn.textContent = '✅ Copied!';
            setTimeout(() => btn.textContent = '📋 Copy Link', 2000);
        });
    }
    
    // Init
    initCityGrid();
    updateClocks();
    setInterval(updateClocks, 1000);
    </script>
