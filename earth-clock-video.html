<body>
<canvas id="canvas"></canvas>
<div class="top-overlay">
  <div class="title">Watch the World Tick</div>
  <div class="subtitle">Real-time day and night across the globe</div>
</div>
<div class="overlay">
  <div class="brand">World Time Sync</div>
  <div class="url">worldtimessync.com</div>
  <div class="tagline">Free world clock for 700+ cities</div>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Stars
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 2 + 0.5,
    twinkle: Math.random() * Math.PI * 2,
    speed: Math.random() * 2 + 1
  });
}

// Cities with positions (lat, lon) and names
const cities = [
  { name: 'New York', lat: 40.7, lon: -74.0, pop: 8.3 },
  { name: 'London', lat: 51.5, lon: -0.1, pop: 9.0 },
  { name: 'Tokyo', lat: 35.7, lon: 139.7, pop: 13.9 },
  { name: 'Dubai', lat: 25.2, lon: 55.3, pop: 3.4 },
  { name: 'Sydney', lat: -33.9, lon: 151.2, pop: 5.3 },
  { name: 'Paris', lat: 48.9, lon: 2.3, pop: 2.2 },
  { name: 'Singapore', lat: 1.3, lon: 103.8, pop: 5.7 },
  { name: 'Mumbai', lat: 19.1, lon: 72.9, pop: 12.4 },
  { name: 'São Paulo', lat: -23.5, lon: -46.6, pop: 12.3 },
  { name: 'Los Angeles', lat: 34.1, lon: -118.2, pop: 4.0 },
  { name: 'Beijing', lat: 39.9, lon: 116.4, pop: 21.5 },
  { name: 'Moscow', lat: 55.8, lon: 37.6, pop: 12.5 },
  { name: 'Cairo', lat: 30.0, lon: 31.2, pop: 9.5 },
  { name: 'Lagos', lat: 6.5, lon: 3.4, pop: 15.4 },
  { name: 'Mexico City', lat: 19.4, lon: -99.1, pop: 9.2 },
  { name: 'Bangkok', lat: 13.8, lon: 100.5, pop: 10.5 },
  { name: 'Seoul', lat: 37.6, lon: 127.0, pop: 9.7 },
  { name: 'Berlin', lat: 52.5, lon: 13.4, pop: 3.6 },
  { name: 'Rome', lat: 41.9, lon: 12.5, pop: 2.9 },
  { name: 'Toronto', lat: 43.7, lon: -79.4, pop: 2.9 },
  { name: 'Hong Kong', lat: 22.3, lon: 114.2, pop: 7.5 },
  { name: 'Istanbul', lat: 41.0, lon: 29.0, pop: 15.5 },
  { name: 'Buenos Aires', lat: -34.6, lon: -58.4, pop: 3.0 },
  { name: 'Nairobi', lat: -1.3, lon: 36.8, pop: 4.4 },
  { name: 'Cape Town', lat: -33.9, lon: 18.4, pop: 4.6 },
  { name: 'Auckland', lat: -36.8, lon: 174.8, pop: 1.7 },
  { name: 'Mumbai', lat: 19.1, lon: 72.9, pop: 12.4 },
  { name: 'Delhi', lat: 28.6, lon: 77.2, pop: 16.8 },
  { name: 'Shanghai', lat: 31.2, lon: 121.5, pop: 24.9 },
];

// Globe parameters
let globeRadius = Math.min(W, H) * 0.32;
let globeX = W / 2;
let globeY = H / 2;

function latLonToXY(lat, lon, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return {
    x: radius * Math.sin(phi) * Math.cos(theta),
    y: -radius * Math.cos(phi),
    z: radius * Math.sin(phi) * Math.sin(theta)
  };
}

function project(x, y, z) {
  // Simple orthographic projection
  if (z < 0) return null; // Behind globe
  return {
    x: globeX + x,
    y: globeY + y,
    depth: z
  };
}

let time = 0;

function draw() {
  time += 0.005;
  
  // Clear
  ctx.fillStyle = '#000008';
  ctx.fillRect(0, 0, W, H);
  
  // Background gradient
  const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
  bgGrad.addColorStop(0, 'rgba(15, 23, 62, 0.5)');
  bgGrad.addColorStop(1, 'rgba(0, 0, 8, 1)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Stars
  const now = Date.now() / 1000;
  stars.forEach(s => {
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(now * s.speed + s.twinkle));
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  // Update globe size
  globeRadius = Math.min(W, H) * 0.32;
  
  // Globe glow
  const glowGrad = ctx.createRadialGradient(globeX, globeY, globeRadius * 0.8, globeX, globeY, globeRadius * 1.5);
  glowGrad.addColorStop(0, 'rgba(96, 165, 250, 0.1)');
  glowGrad.addColorStop(1, 'rgba(96, 165, 250, 0)');
  ctx.fillStyle = glowGrad;
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeRadius * 1.5, 0, Math.PI * 2);
  ctx.fill();
  
  // Globe body
  const globeGrad = ctx.createRadialGradient(globeX - globeRadius * 0.3, globeY - globeRadius * 0.3, 0, globeX, globeY, globeRadius);
  globeGrad.addColorStop(0, '#1e3a5f');
  globeGrad.addColorStop(0.5, '#0d2a4a');
  globeGrad.addColorStop(1, '#051525');
  ctx.fillStyle = globeGrad;
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeRadius, 0, Math.PI * 2);
  ctx.fill();
  
  // Globe border
  ctx.strokeStyle = 'rgba(96, 165, 250, 0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeRadius, 0, Math.PI * 2);
  ctx.stroke();
  
  // Grid lines (latitude)
  ctx.strokeStyle = 'rgba(96, 165, 250, 0.08)';
  ctx.lineWidth = 0.5;
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    let started = false;
    for (let lon = -180; lon <= 180; lon += 5) {
      const pos = latLonToXY(lat, lon, globeRadius);
      const p = project(pos.x, pos.y, pos.z);
      if (p) {
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      } else {
        started = false;
      }
    }
    ctx.stroke();
  }
  
  // Grid lines (longitude)
  for (let lon = -180; lon < 180; lon += 30) {
    ctx.beginPath();
    let started = false;
    for (let lat = -90; lat <= 90; lat += 5) {
      const pos = latLonToXY(lat, lon, globeRadius);
      const p = project(pos.x, pos.y, pos.z);
      if (p) {
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      } else {
        started = false;
      }
    }
    ctx.stroke();
  }
  
  // Day/night terminator
  const sunAngle = time * 0.5;
  
  // Draw night side as a gradient overlay on the globe
  ctx.save();
  ctx.beginPath();
  ctx.arc(globeX, globeY, globeRadius, 0, Math.PI * 2);
  ctx.clip();
  
  // Night shadow
  const shadowGrad = ctx.createLinearGradient(
    globeX - globeRadius + Math.cos(sunAngle) * globeRadius * 0.5,
    globeY - globeRadius,
    globeX + globeRadius + Math.cos(sunAngle) * globeRadius * 0.5,
    globeY + globeRadius
  );
  shadowGrad.addColorStop(0, 'rgba(0, 0, 20, 0.6)');
  shadowGrad.addColorStop(0.4, 'rgba(0, 0, 20, 0.3)');
  shadowGrad.addColorStop(0.5, 'rgba(0, 0, 20, 0)');
  shadowGrad.addColorStop(1, 'rgba(0, 0, 20, 0.6)');
  ctx.fillStyle = shadowGrad;
  ctx.fillRect(globeX - globeRadius, globeY - globeRadius, globeRadius * 2, globeRadius * 2);
  
  ctx.restore();
  
  // Cities
  cities.forEach(city => {
    // Rotate based on time (Earth rotates)
    const lon = city.lon + time * 15; // 15 degrees per hour visual
    const pos = latLonToXY(city.lat, lon, globeRadius);
    const p = project(pos.x, pos.y, pos.z);
    
    if (p) {
      // Check if in day or night
      const sunLon = (time * 15) % 360;
      const cityLonNorm = ((lon + 180) % 360) - 180;
      const sunLonNorm = ((sunLon + 180) % 360) - 180;
      const lonDiff = Math.abs(cityLonNorm - sunLonNorm);
      const isDay = lonDiff < 90;
      
      // City dot
      const dotSize = 2 + city.pop / 5;
      
      // Glow
      const glowSize = dotSize * 4;
      const glowAlpha = isDay ? 0.4 : 0.2;
      const cityGlow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowSize);
      cityGlow.addColorStop(0, isDay ? `rgba(96, 165, 250, ${glowAlpha})` : `rgba(96, 165, 250, ${glowAlpha * 0.5})`);
      cityGlow.addColorStop(1, 'rgba(96, 165, 250, 0)');
      ctx.fillStyle = cityGlow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, glowSize, 0, Math.PI * 2);
      ctx.fill();
      
      // Dot
      ctx.fillStyle = isDay ? '#60a5fa' : '#3b6fa0';
      ctx.beginPath();
      ctx.arc(p.x, p.y, dotSize, 0, Math.PI * 2);
      ctx.fill();
      
      // White center
      ctx.fillStyle = isDay ? '#fff' : 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, dotSize * 0.4, 0, Math.PI * 2);
      ctx.fill();
      
      // City name for larger cities
      if (city.pop > 10 && p.depth > globeRadius * 0.3) {
        ctx.fillStyle = isDay ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.4)';
        ctx.font = `${Math.max(10, Math.min(14, city.pop / 2))}px system-ui`;
        ctx.textAlign = 'center';
        ctx.fillText(city.name, p.x, p.y - dotSize - 6);
      }
    }
  });
  
  // Orbiting satellite
  const satAngle = time * 2;
  const satX = globeX + Math.cos(satAngle) * (globeRadius + 40);
  const satY = globeY + Math.sin(satAngle) * (globeRadius + 40) * 0.3;
  
  // Satellite trail
  for (let i = 20; i > 0; i--) {
    const trailAngle = satAngle - i * 0.05;
    const tx = globeX + Math.cos(trailAngle) * (globeRadius + 40);
    const ty = globeY + Math.sin(trailAngle) * (globeRadius + 40) * 0.3;
    ctx.fillStyle = `rgba(96, 165, 250, ${0.3 * (1 - i/20)})`;
    ctx.beginPath();
    ctx.arc(tx, ty, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Satellite body
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(satX, satY, 3, 0, Math.PI * 2);
  ctx.fill();
  
  // Satellite glow
  const satGlow = ctx.createRadialGradient(satX, satY, 0, satX, satY, 15);
  satGlow.addColorStop(0, 'rgba(255,255,255,0.3)');
  satGlow.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = satGlow;
  ctx.beginPath();
  ctx.arc(satX, satY, 15, 0, Math.PI * 2);
  ctx.fill();
  
  // Second satellite (opposite direction)
  const sat2Angle = satAngle + Math.PI;
  const sat2X = globeX + Math.cos(sat2Angle) * (globeRadius + 60);
  const sat2Y = globeY + Math.sin(sat2Angle) * (globeRadius + 60) * 0.25;
  ctx.fillStyle = '#60a5fa';
  ctx.beginPath();
  ctx.arc(sat2X, sat2Y, 2, 0, Math.PI * 2);
  ctx.fill();
  
  requestAnimationFrame(draw);
}

draw();
</script>
