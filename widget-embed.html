<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .widget {
            text-align: center;
            padding: 16px 20px;
            width: 100%;
        }
        .city-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.8;
        }
        .time {
            font-size: 2.4em;
            font-weight: 700;
            font-family: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
            letter-spacing: -1px;
            line-height: 1.1;
        }
        .time .seconds {
            font-size: 0.5em;
            opacity: 0.5;
            vertical-align: super;
        }
        .date {
            font-size: 12px;
            opacity: 0.5;
            margin-top: 4px;
        }
        .offset {
            font-size: 11px;
            opacity: 0.4;
            margin-top: 2px;
        }
        .day-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .day-indicator.day { background: #facc15; }
        .day-indicator.night { background: #6366f1; }
        
        /* Size variants */
        .widget.small .time { font-size: 1.8em; }
        .widget.small .city-name { font-size: 12px; }
        .widget.small .date { font-size: 10px; }
        .widget.large .time { font-size: 3.2em; }
        .widget.large .city-name { font-size: 16px; }
        .widget.large .date { font-size: 14px; }
        
        /* Theme: dark (default) */
        body.dark { background: #0a0a0a; color: #fff; }
        
        /* Theme: light */
        body.light { background: #f8fafc; color: #1e293b; }
        body.light .city-name { opacity: 0.7; }
        body.light .date { opacity: 0.4; }
        body.light .offset { opacity: 0.3; }
    </style>
<meta name="google-site-verification" content="tNRYRY4K5ZdeEBPId3_g0GiclaIlooP5GhihYhXwknk" />
<script src="https://analytics.ahrefs.com/analytics.js" data-key="hB1VYWuwb1i/f1d8re7P2A" async></script>
</head>
<body>
    <div class="widget" id="widget">
        <div class="city-name" id="cityName">Loading...</div>
        <div class="time" id="timeDisplay">--:--:--</div>
        <div class="date" id="dateDisplay">---</div>
        <div class="offset" id="offsetDisplay">UTC</div>
    </div>

    <script>
    (function() {
        // Parse URL params
        var params = new URLSearchParams(window.location.search);
        var tz = params.get('tz') || 'America/New_York';
        var theme = params.get('theme') || 'dark';
        var size = params.get('size') || 'medium';
        var showDate = params.get('date') !== '0';
        var customBg = params.get('bg') || '';
        var customText = params.get('text') || '';

        // Apply theme
        document.body.className = theme;
        if (customBg) document.body.style.background = customBg;
        if (customText) document.body.style.color = customText;

        // Apply size
        document.getElementById('widget').className = 'widget ' + size;

        // Extract city name from timezone
        var cityName = tz.split('/').pop().replace(/_/g, ' ');
        document.getElementById('cityName').textContent = cityName;

        // Hide date if not needed
        if (!showDate) {
            document.getElementById('dateDisplay').style.display = 'none';
        }

        // Update clock
        function update() {
            try {
                var now = new Date();
                
                // Time
                var timeStr = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(now);
                
                // Date
                var dateStr = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric'
                }).format(now);

                // UTC offset
                var offsetStr = new Intl.DateTimeFormat('en-US', {
                    timeZone: tz,
                    timeZoneName: 'shortOffset'
                }).formatToParts(now).find(function(p) { return p.type === 'timeZoneName'; })?.value || '';

                // Day/night indicator
                var hour = parseInt(new Intl.DateTimeFormat('en-US', {
                    timeZone: tz, hour: 'numeric', hour12: false
                }).format(now));
                var isDay = hour >= 6 && hour < 18;

                // Update DOM
                var timeEl = document.getElementById('timeDisplay');
                var parts = timeStr.split(':');
                timeEl.innerHTML = parts[0] + ':' + parts[1] + '<span class="seconds">' + parts[2] + '</span>';
                
                // Add day indicator
                var existing = timeEl.querySelector('.day-indicator');
                if (existing) existing.remove();
                var indicator = document.createElement('span');
                indicator.className = 'day-indicator ' + (isDay ? 'day' : 'night');
                timeEl.insertBefore(indicator, timeEl.firstChild);

                document.getElementById('dateDisplay').textContent = dateStr;
                document.getElementById('offsetDisplay').textContent = offsetStr;

            } catch(e) {
                document.getElementById('cityName').textContent = 'Invalid timezone';
                document.getElementById('timeDisplay').textContent = '--:--:--';
            }
        }

        update();
        setInterval(update, 1000);
    })();
    </script>
</body>
</html>
