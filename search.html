    <style>
        .search-container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .search-box { 
            width: 100%;

        .result-item {

        .result-title {

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
    
    <script>
    (function() {
        // Search index - populated at build time
        var searchIndex = [];
        var fuse = null;
        var searchInput = document.getElementById('search-input');
        var searchResults = document.getElementById('search-results');
        var searchStats = document.getElementById('search-stats');
        var suggestions = document.getElementById('suggestions');
        var zeroResultsMsg = document.getElementById('zero-results-msg');
        var searchForm = document.getElementById('search-form');
        var debounceTimer = null;
        
        // Load search index
        fetch('/search-index.json')
            .then(function(response) { return response.json(); })
            .then(function(data) {
                searchIndex = data;
                fuse = new Fuse(searchIndex, {
                    keys: ['title', 'description', 'tags', 'url'],
                    threshold: 0.4,
                    includeScore: true,
                    includeMatches: true,
                    minMatchCharLength: 2,
                    ignoreLocation: true,
                });
                searchInput.disabled = false;
                searchInput.placeholder = 'Search for a city, country, time zone, or topic...';
            })
            .catch(function(err) {
                console.error('Failed to load search index:', err);
                searchInput.placeholder = 'Search unavailable - try again later';
            });
        
        function performSearch(query) {
            if (!fuse || !query.trim()) {
                searchResults.innerHTML = '';
                searchStats.style.display = 'none';
                suggestions.style.display = 'block';
                zeroResultsMsg.style.display = 'none';
                return;
            }
            
            var results = fuse.search(query).slice(0, 20);
            
            if (results.length === 0) {
                searchResults.innerHTML = '';
                searchStats.textContent = 'No results for "' + escapeHtml(query) + '"';
                searchStats.style.display = 'block';
                suggestions.style.display = 'none';
                zeroResultsMsg.style.display = 'block';
                
                // Log zero-results query to analytics endpoint
                logZeroResultsQuery(query);
                return;
            }
            
            searchStats.textContent = results.length + ' result' + (results.length !== 1 ? 's' : '') + ' for "' + escapeHtml(query) + '"';
            searchStats.style.display = 'block';
            suggestions.style.display = 'none';
            zeroResultsMsg.style.display = 'none';
            
            var html = '';
            results.forEach(function(result) {
                var item = result.item;
                var snippet = item.description || '';
                // Highlight matches
                if (result.matches) {
                    result.matches.forEach(function(match) {
                        if (match.key === 'description' && match.indices) {
                            // Simple highlighting - just show first 200 chars with match context
                        }
                    });
                }
                if (snippet.length > 200) snippet = snippet.substring(0, 200) + '...';
                
                html += '<div class="result-item">' +
                    '<a href="' + escapeHtml(item.url) + '" class="result-title">' + escapeHtml(item.title) + '</a>' +
                    '<div class="result-snippet">' + escapeHtml(snippet) + '</div>' +
                    '<span class="result-url">' + escapeHtml(item.url) + '</span>' +
                '</div>';
            });
            searchResults.innerHTML = html;
        }
        
        function logZeroResultsQuery(query) {
            // Send to analytics endpoint (can be a simple serverless function)
            fetch('/api/log-zero-results', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    query: query, 
                    timestamp: new Date().toISOString(),
                    referrer: document.referrer,
                    userAgent: navigator.userAgent
                })
            }).catch(function() { /* Silently fail */ });
        }
        
        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        searchInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function() {
                performSearch(searchInput.value);
            }, 150);
        });
        
        searchForm.addEventListener('submit', function(e) {
            e.preventDefault();
            performSearch(searchInput.value);
        });
        
        // Handle Enter key
        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch(searchInput.value);
            }
        });
    })();
    </script>
