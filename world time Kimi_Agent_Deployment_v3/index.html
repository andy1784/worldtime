    <!-- Optimized Service Worker Registration with immediate activation -->
    <script>
      // Register SW immediately for better caching
      if('serviceWorker' in navigator){
        window.addEventListener('load',()=>{
          navigator.serviceWorker.register('./sw.js',{scope:'./'})
            .then(reg=>{
              console.log('SW registered:',reg.scope);
              // Check for updates periodically
              setInterval(()=>reg.update(),300000); // 5 minutes
            })
            .catch(err=>console.log('SW registration failed:',err));
          
          // Use cached version immediately if available
          navigator.serviceWorker.ready.then(reg=>{
            if(reg.active&&navigator.serviceWorker.controller){
              console.log('Using cached version');
            }
          });
        });
        
        // Unregister old SWs on page unload
        window.addEventListener('beforeunload',()=>{
          navigator.serviceWorker.getRegistrations().then(regs=>{
            regs.forEach(reg=>{if(!reg.active)reg.unregister();});
          });
        });
      }
      
      // Performance monitoring
      window.addEventListener('load',()=>{
        if('PerformanceObserver' in window){
          const observer=new PerformanceObserver(list=>{
            list.getEntries().forEach(entry=>{
              if(entry.entryType==='largest-contentful-paint'){
                console.log('LCP:',entry.startTime);
              }
              if(entry.entryType==='first-input'){
                console.log('FID:',entry.processingStart-entry.startTime);
              }
            });
          });
          observer.observe({entryTypes:['largest-contentful-paint','first-input']});
        }
        
        // Core Web Vitals tracking
        requestIdleCallback?requestIdleCallback(()=>{
          console.log('Page ready - TTI:',performance.now());
        }):setTimeout(()=>console.log('Page ready - TTI:',performance.now()),1000);
      });
    </script>
